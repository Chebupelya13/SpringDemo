spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth
spring.mvc.async.request-timeout=65000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

logging.level.org.springframework.security=INFO
logging.charset.console=UTF-8
logging.charset.file=UTF-8

jwt.key=hardToGuessVeryLooooooonoooooooooogString

minio.url=${MINIO_URL:http://127.0.0.1:9000}
minio.user=${MINIO_USER:minioadmin}
minio.password=${MINIO_PASSWORD:minioadmin}
minio.bucket=bank

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/master-changelog.xml
logging.level.liquibase=INFO


