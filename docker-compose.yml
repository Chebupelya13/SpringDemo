version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://host.docker.internal:5432/bankdb
      - MINIO_URL=http://minio:9000
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - minio
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"


volumes:
  minio_data:
  redis_data:
